<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>EloCalc</title>
	<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — EloCalc
		   960px: one results table, sortable, wide enough for the rating columns.
		   Competitor rows are flex so name/win/tie/elo keep their ratios.

		#headName, #headWin, #headTie, #headElo {

		.hidden-btn { visibility: hidden; cursor: default; }

		#competitorsHeader { margin-top: var(--sp-5); margin-bottom: var(--sp-2); font-size: 1rem; }
		#list { margin-bottom: var(--sp-4); }
		#mainElo { margin-top: var(--sp-2); }

		/* Each toggle is one .check unit so a checkbox never wraps away from
		   its text; the row wraps between units instead. */
		.options-row { margin-top: var(--sp-4); gap: var(--sp-2) var(--sp-4); }

		.actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
		.actions button { flex: 1; min-width: 150px; }

		.table-wrapper {
			overflow: auto;
			-webkit-overflow-scrolling: touch;
			max-height: 70vh;
		}
		table { font-size: .9rem; }
		th { cursor: pointer; z-index: 5; }
		th:hover { background: var(--muted); }
		th::after { content: ''; display: inline-block; margin-left: 5px; width: .8em; opacity: .7; }
		th.sort-asc::after { content: '\25B2'; }

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);
				if (!parts) return true;                       // named or hex: it paints
				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (!langSel) AppSettings.renderSettings();
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

	<script>
		const text = {
			en: {
				title: 'EloCalc',
				subtitle: 'Convert between Win Rates and Elo Ratings',
				themeAuto: 'Auto',
				themeLight: 'Light',
				themeDark: 'Dark',
				mainLabel: 'Main Contender',

		const elements = new Proxy({}, { get: (_, id) => document.getElementById(id) });
		const escape = string => string.replace(/[&<>"']/g, char => '&#' + char.charCodeAt(0) + ';');

		const parseCSV = text => {
			// ⚡ Bolt: Use substring for O(1) memory overhead when extracting first line
			const firstLine = text.substring(0, text.indexOf('\n') > -1 ? text.indexOf('\n') : text.length);
			let commas = 0, tabs = 0, inside = false;
			for (const char of firstLine) {
				if (char === '"') { inside = !inside; continue; }
				if (!inside && char === ',') { commas++; continue; }
				if (!inside && char === '\t') { tabs++; continue; }
			}
			const separator = tabs >= commas && tabs > 0 ? '\t' : ',';
			const rows = [];
			let currentRow = [], currentCell = '';
			let insideQuote = false;

			const pushRow = () => {
				currentRow.push(currentCell);
				if (currentRow.length > 1 || currentRow[0].trim()) rows.push(currentRow);
				currentRow = [];
				currentCell = '';
			};

			for (let index = 0; index < text.length; index++) {
				const char = text[index];
				const nextChar = text[index + 1];
				if (char === '"') insideQuote = !insideQuote;

				if (char === separator && !insideQuote) {
					currentRow.push(currentCell);
					currentCell = '';
					continue;
				}

				if ((char === '\n' || char === '\r') && !insideQuote) {
					if (char === '\r' && nextChar === '\n') index++;
					pushRow();
					continue;
				}

				currentCell += char;
			}
			if (currentCell || currentRow.length) pushRow();
			return rows.map(row => row.map(cell => cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"')));
		};

		class EloCalc {
			get isWinInput() { return this.mode === 'win' || (this.mode === 'dual' && this.dualSource === 'win'); }
			get isEloInput() { return this.mode === 'elo' || (this.mode === 'dual' && this.dualSource === 'elos'); }

			constructor() {
				this.competitors = Object.entries({
					'Player B': [65, 10, 1000],
					'Player C': [45, 15, 1200],
					'Player D': [30, 20, 800]
				}).map(([name, [winRate, tieRate, elo]], index) => ({ id: index + 1, name, winRate, tieRate, elo }));
				this.nextIndex = 4;
				this.data = null;
				this.allowTies = true;
				this.anchorMain = false;
				this.normalizeElo = false;
				this.mode = 'win';
				this.dualSource = 'elos';
				this.sortState = { field: 'eloRating', direction: -1 };
				this.setup();
				this.theme('auto');
				this.language = AppSettings.detectLang(Object.keys(text));
				this.lang(this.language);
				this.setMode('win');
			}

			setup() {
				const handlers = {
					add: () => this.add(),
					clear: () => this.clear(),
					calculate: () => this.calculate(),
					edit: () => this.display('input'),
					copy: () => this.copy(),
					export: () => this.export(),
					import: () => elements.file.click()
				};
				Object.entries(handlers).forEach(([id, handler]) => elements[id].onclick = handler);
				elements.file.onchange = event => this.load(event.target.files[0]);
				elements.input.oninput = event => {
					this.error();
					if (event.target.matches('.win-input, .tie-input')) this.validateRow(event.target.closest('.competitor-row'));
				};
				elements.language.onchange = event => this.lang(event.target.value);
				elements.theme.onchange = event => this.theme(event.target.value);
				elements.mode.onchange = event => this.setMode(event.target.value);
				elements.dualSource.onchange = event => {
					this.dualSource = event.target.value;
					elements.input.dataset.source = this.dualSource;
					this.renderCompetitors();
				};
				elements.allowTies.onchange = event => {
					this.allowTies = event.target.checked;
					elements.headTie.classList.toggle('hidden', !this.allowTies);
					document.querySelectorAll('.tie-input').forEach(el => el.classList.toggle('hidden', !this.allowTies));
					document.querySelectorAll('.competitor-row').forEach(row => this.validateRow(row));
				};
				elements.allowTies.checked = this.allowTies;
				elements.anchorMain.onchange = event => { this.anchorMain = event.target.checked; this.calculate(); };
				elements.anchorMain.checked = this.anchorMain;
				elements.normalizeElo.onchange = event => { this.normalizeElo = event.target.checked; this.calculate(); };
				elements.normalizeElo.checked = this.normalizeElo;
				document.onkeydown = event => this.key(event);
				elements.resultsTable.addEventListener('click', event => this.handleTableAction(event));
				elements.resultsTable.addEventListener('keydown', event => this.handleTableAction(event));
				elements.list.onclick = event => {
					const row = event.target.closest('.competitor-row');
					if (event.target.matches('.danger') && row) this.remove(+row.dataset.id);
				};
				elements.list.onchange = event => {
					const row = event.target.closest('.competitor-row');
					const competitor = row && this.competitors.find(c => c.id === +row.dataset.id);
					if (competitor) this.updateCompetitor(competitor, event.target);
				};
			}

			key(event) {
				if (event.key !== 'Enter') return;

				if (event.target.matches('input') && event.target.closest('.competitor-row')) {
					const row = event.target.closest('.competitor-row');
					const competitor = this.competitors.find(c => c.id === +row.dataset.id);
					if (competitor) this.updateCompetitor(competitor, event.target);

					if (event.ctrlKey || event.metaKey) { this.calculate(); return; }

					event.preventDefault();
					this.focusNext(event.target, row);
					return;
				}

				if (event.ctrlKey || event.metaKey) {
					this.calculate();
					return;
				}

				if (event.target.matches('#mainName, #mainElo, #allowTies')) {
					event.preventDefault();
					if (event.target.id === 'mainName' && this.isEloInput) {
						elements.mainElo.focus();
						return;
					}
					const firstInput = elements.list.firstElementChild?.querySelector('input');
					if (firstInput) {
						firstInput.focus();
						return;
					}
					elements.add.focus();
				}
			}

			handleTableAction(event) {
				if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
				const header = event.target.closest('th[data-sort]');
				if (header) { event.preventDefault(); this.sortResults(header.dataset.sort); return; }
				const row = event.target.closest('tr[data-id]');
				if (row) { event.preventDefault(); this.setBaseline(row.dataset.id); }
			}

			updateCompetitor(competitor, target) {
				const value = target.value;
				if (target.classList.contains('name-input')) { competitor.name = value; return; }
				if (target.classList.contains('win-input')) { this.updateRate(competitor, 'winRate', value); return; }
				if (target.classList.contains('tie-input')) { this.updateRate(competitor, 'tieRate', value); return; }
				if (target.classList.contains('elo-input')) { this.updateRate(competitor, 'elo', value); return; }
			}

			updateRate(competitor, property, value) {
				competitor[property] = value === '' ? '' : (parseFloat(value) || 0);
			}

			focusNext(target, row) {
				if (target.classList.contains('name-input')) {
					if (this.isEloInput) { row.querySelector('.elo-input')?.focus(); return; }
					row.querySelector('.win-input')?.focus();
					return;
				}
				if (target.classList.contains('win-input') && this.allowTies) {
					row.querySelector('.tie-input')?.focus();
					return;
				}
				if (row.nextElementSibling && this.mode !== 'dual') {
					row.nextElementSibling.querySelector('input')?.focus();
					return;
				}
				if (this.mode !== 'dual') {
					this.add();
				}
			}

			string(key) { return text[this.language]?.[key] ?? key; }
			format(value, options = {}) { return value.toLocaleString(this.language === 'id' ? 'id-ID' : 'en-US', options); }

			theme(themeName) { AppSettings.applyTheme(themeName); }

			lang(language) {
				this.language = AppSettings.applyLang(language);
				Object.keys(text.en).forEach(key => { if (elements[key]) elements[key].textContent = this.string(key); });
				this.updateLabels();
				[['language', 'langLabel'], ['theme', 'themeLabel'], ['mode', 'modeLabel'], ['settingsBtn', 'prefBtn']].forEach(([id, key]) => elements[id].setAttribute('aria-label', this.string(key)));
				this.renderCompetitors();
				if (!elements.results.classList.contains('hidden') && this.data) this.renderResults();
			}

			setMode(mode) {
				this.mode = mode;
				elements.input.classList.remove('mode-win', 'mode-elo', 'mode-dual');
				elements.input.classList.add(`mode-${mode}`);
				elements.mode.value = mode;
				elements.input.dataset.source = this.dualSource;
				elements.dualOptions.classList.toggle('hidden', mode !== 'dual');
				this.error();
				this.renderCompetitors();
			}

			updateLabels() {
				elements.headName.textContent = this.string('name');
				elements.headWin.textContent = this.string('winRatePlaceholder');
				elements.headTie.textContent = this.string('tieRatePlaceholder');
				elements.headElo.textContent = this.string('eloPlaceholder');
				elements.mainElo.placeholder = this.string('eloPlaceholder');
				elements.mainElo.setAttribute('aria-label', this.string('eloPlaceholder'));
				[...elements.mode.options].forEach(option => option.textContent = this.string('mode' + option.value.charAt(0).toUpperCase() + option.value.slice(1)));
				[...elements.dualSource.options].forEach(option => option.textContent = this.string('dualSource' + option.value.charAt(0).toUpperCase() + option.value.slice(1)));
			}

			display(section) {
				['input', 'results'].forEach(id => elements[id].classList.toggle('hidden', id !== section));
				if (section === 'results') {
					elements.results.setAttribute('tabindex', '-1');
					elements.results.focus();
					return;
				}
				elements.mainName.focus();
			}

			error(message) {
				elements.error.textContent = message || '';
				elements.error.classList.toggle('hidden', !message);
			}

			add() {
				this.error();
				this.competitors.push({ id: this.nextIndex++, name: '', winRate: '', tieRate: '', elo: '' });
				this.renderCompetitors();
				elements.list.lastElementChild?.querySelector('input')?.focus();
			}

			clear() {
				if (confirm(this.string('clearConfirm'))) {
					this.competitors = [];
					this.renderCompetitors();
					this.add();
					this.error();
				}
			}

			remove(id) {
				this.error();
				const index = this.competitors.findIndex(c => c.id === id);
				this.competitors = this.competitors.filter(c => c.id !== id);
				this.renderCompetitors();
				const target = Math.min(index, this.competitors.length - 1);
				if (target >= 0) {
					elements.list.children[target]?.querySelector('.danger')?.focus();
					return;
				}
				elements.add.focus();
			}

			renderCompetitors() {
				elements.headTie.classList.toggle('hidden', !this.allowTies);
				elements.list.innerHTML = this.competitors.map((competitor, index) => {
					const invalid = this.isInvalid(competitor) ? 'invalid' : '';
					return `<div class="competitor-row" data-id="${competitor.id}">
						<input type="text" class="name-input" value="${escape(competitor.name)}" placeholder="${this.string('competitorPlaceholder')}" aria-label="${this.string('competitorPlaceholder')} ${index + 1}">
						<input type="number" class="win-input ${invalid}" value="${competitor.winRate}" placeholder="${this.string('winRatePlaceholder')}" min="0" max="100" step="0.1" aria-label="${this.string('winRatePlaceholder')} ${index + 1}">
						<input type="number" class="tie-input ${this.allowTies ? '' : 'hidden'} ${invalid}" value="${competitor.tieRate}" placeholder="${this.string('tieRatePlaceholder')}" min="0" max="100" step="0.1" aria-label="${this.string('tieRatePlaceholder')} ${index + 1}">
						<input type="number" class="elo-input" value="${competitor.elo}" placeholder="${this.string('eloPlaceholder')}" aria-label="${this.string('eloPlaceholder')} ${index + 1}">
						<button class="danger" aria-label="${this.string('removeCompetitor')} ${index + 1}" title="${this.string('removeCompetitor')}">×</button>
					</div>`;
				}).join('');
			}

			load(file) {
				const reader = new FileReader();
				reader.onload = event => {
					try {
						const rows = parseCSV(event.target.result);
						if (!rows.length) throw new Error();

						const header = rows[0];
						const find = regex => header.findIndex(cell => regex.test(cell));
						let nameIndex = find(/name|nama/i);
						let winIndex = find(/win|menang/i);
						let tieIndex = find(/tie|seri/i);
						let eloIndex = find(/elo/i);

						if (nameIndex < 0 || (winIndex < 0 && eloIndex < 0)) {
							nameIndex = 0;
							if (this.mode === 'elo') eloIndex = 1;
							if (this.mode !== 'elo') winIndex = 1;

							const isAllNumbers = header.every(cell => /^-?\d+$/.test(cell.replace(/[.,]/g, '').trim()));
							const numIndex = header.findIndex(cell => /^-?\d+$/.test(cell.replace(/[.,]/g, '').trim()));

							if (isAllNumbers || (numIndex >= 0 && header.length === 2)) {
								if (this.mode === 'elo') eloIndex = numIndex;
								if (this.mode !== 'elo') winIndex = numIndex;
								nameIndex = 1 - numIndex;
							}
						}

						if (nameIndex < 0 || (winIndex < 0 && eloIndex < 0)) throw new Error();

						const targetIndex = this.mode === 'elo' && eloIndex >= 0 ? eloIndex : winIndex;
						const isTargetNum = targetIndex >= 0 && !isNaN(parseFloat((header[targetIndex] || '').replace(',', '.')));
						const hasHeader = find(/name|nama/i) >= 0 || find(/win|menang/i) >= 0 || find(/elo/i) >= 0 || !isTargetNum;

						const competitors = (hasHeader ? rows.slice(1) : rows).map(cells => {
							if (!cells[nameIndex]) return null;
							const parseNum = (cell, fallback) => {
								if (!cell) return fallback;
								const parsed = parseFloat(cell.replace(/,/g, '.').replace(/[^\d.-]/g, ''));
								return isNaN(parsed) ? fallback : parsed;
							};
							const winRate = winIndex >= 0 ? parseNum(cells[winIndex], 0) : '';
							const tieRate = tieIndex >= 0 ? parseNum(cells[tieIndex], 0) : 0;
							const elo = eloIndex >= 0 ? parseNum(cells[eloIndex], '') : '';
							return { id: this.nextIndex++, name: cells[nameIndex], winRate, tieRate, elo };
						}).filter(Boolean);

						if (!competitors.length) throw new Error();

						this.competitors = competitors;
						if (tieIndex >= 0) { this.allowTies = true; elements.allowTies.checked = true; }
						this.error();
						this.renderCompetitors();
					} catch {
						this.error(this.string('alertImport'));
					} finally {
						elements.file.value = '';
					}
				};
				if (file) reader.readAsText(file);
			}

			calculate() {
				this.error();
				const mainName = elements.mainName.value.trim() || 'Main';

				if (this.mode !== 'dual') {
					this.competitors = this.competitors.filter(c =>
						c.name.trim() ||
						(this.mode === 'win' && (c.winRate !== '' || c.tieRate !== '')) ||
						(this.mode === 'elo' && c.elo !== '')
					);
				}
				this.renderCompetitors();

				if (!this.competitors.length) {
					this.error(this.string('alertCompetitors'));
					return;
				}

				if (this.mode === 'win' && this.competitors.some(c => this.isInvalid(c))) {
					this.error(this.string('alertInvalidRate'));
					return;
				}

				if (this.mode === 'dual' && this.dualSource === 'win' && this.isInvalid(this.competitors[0])) {
					this.error(this.string('alertInvalidRate'));
					return;
				}

				this.performCalculation(mainName);
			}

			performCalculation(mainName) {
				const mainElo = parseFloat(elements.mainElo.value) || 0;
				const strategies = {
					win: () => this.calculateWinMode(mainName),
					elo: () => this.calculateEloMode(mainName, mainElo),
					dual: () => this.calculateDualMode(mainName, mainElo)
				};

				const { allResults, baselineId, averageElo } = strategies[this.mode]();

				let closestId = null;
				let minDifference = Infinity;

				allResults.forEach(result => {
					const difference = Math.abs(result.eloRating - averageElo);
					if (difference < minDifference) { minDifference = difference; closestId = result.id; }
				});

				this.data = {
					results: allResults.sort((a, b) => b.eloRating - a.eloRating),
					allowTies: this.allowTies,
					isWinMode: this.isWinInput,
					baselineId: this.data?.baselineId && allResults.find(r => r.id === this.data.baselineId) ? this.data.baselineId : baselineId,
					closestId,
					mode: this.mode
				};
				this.sortState = { field: 'eloRating', direction: -1 };
				this.updateRelativeStats();
				this.renderResults();
				this.display('results');
			}

			calculateWinMode(mainName) {
				const allResults = [{ name: mainName, rawElo: 0, isMain: true, id: 'main', winRate: 50, tieRate: 0 }, ...this.competitors.map(c => this.calculateRow(c))];
				const rawAverage = allResults.reduce((sum, result) => sum + result.rawElo, 0) / allResults.length;
				const adjustment = this.anchorMain ? 1000 : 1000 - rawAverage;

				allResults.forEach(result => result.eloRating = result.rawElo + adjustment);

				return { allResults, baselineId: 'main', averageElo: this.anchorMain ? rawAverage + 1000 : 1000 };
			}

			calculateEloMode(mainName, mainElo) {
				const allResults = [
					{ name: mainName, eloRating: mainElo, id: 'main' },
					...this.competitors.map(c => ({ name: c.name.trim() || `Competitor ${c.id}`, eloRating: parseFloat(c.elo) || 0, id: c.id }))
				];

				let averageElo = allResults.reduce((sum, result) => sum + result.eloRating, 0) / allResults.length;
				if (this.normalizeElo) {
					const adjustment = 1000 - averageElo;
					allResults.forEach(result => result.eloRating += adjustment);
					averageElo = 1000;
				}
				return { allResults, baselineId: allResults[0].id, averageElo };
			}

			calculateDualMode(mainName, mainElo) {
				const competitor = this.competitors[0];
				const isWin = this.dualSource === 'win';
				const rowData = isWin ? this.calculateRow(competitor) : null;

				const allResults = [
					{ name: mainName, eloRating: mainElo, id: 'main', winRate: 50, tieRate: 0 },
					{
						name: competitor.name.trim() || `Competitor ${competitor.id}`,
						eloRating: isWin ? mainElo + rowData.rawElo : (parseFloat(competitor.elo) || 0),
						id: competitor.id,
						winRate: isWin ? rowData.winRate : 50,
						tieRate: isWin ? rowData.tieRate : 0
					}
				];

				return { allResults, baselineId: 'main', averageElo: (allResults[0].eloRating + allResults[1].eloRating) / 2 };
			}

			updateRelativeStats() {
				if (!this.data) return;
				const { results, baselineId } = this.data;
				const baselineCompetitor = results.find(r => r.id === baselineId) || results[0];

				let currentRank = 1;
				this.processedResults = results.map((result, index) => {
					const { eloDifference, effectiveScore } = this.calculateRowStats(result, baselineCompetitor);
					if (index === 0 || Math.round(result.eloRating) !== Math.round(results[index - 1].eloRating)) {
						currentRank = index + 1;
					}
					return {
						...result,
						rank: currentRank,
						eloDifference,
						effectiveScore,
						displayWinRate: this.data.isWinMode ? result.winRate : effectiveScore * 100
					};
				});
			}

			calculateRow(competitor) {
				const tieRate = this.allowTies ? +competitor.tieRate : 0;
				const effectiveScore = (+competitor.winRate + tieRate * 0.5) / 100;

				const eloDifference = effectiveScore >= 1 ? 2000 :
				                    effectiveScore <= 0 ? -2000 :
				                    -400 * Math.log10(1 / effectiveScore - 1);

				return {
					name: competitor.name.trim() || `Competitor ${competitor.id}`,
					rawElo: eloDifference,
					id: competitor.id,
					winRate: +competitor.winRate,
					tieRate
				};
			}

			calculateRowStats(result, baselineCompetitor) {
				const eloDifference = result.eloRating - baselineCompetitor.eloRating;
				const effectiveScore = 1 / (1 + Math.pow(10, -eloDifference / 400));
				return { eloDifference, effectiveScore };
			}

			isInvalid(competitor) {
				if (this.isEloInput) return false;
				const winRate = +competitor.winRate;
				const tieRate = this.allowTies ? +competitor.tieRate : 0;
				return winRate < 0 || winRate > 100 || tieRate < 0 || tieRate > 100 || winRate + tieRate > 100;
			}

			validateRow(row) {
				if (!row || this.isEloInput) {
					if (row) row.querySelectorAll('input').forEach(input => input.classList.remove('invalid'));
					return;
				}
				const winInput = row.querySelector('.win-input');
				const tieInput = row.querySelector('.tie-input');
				if (!winInput || !tieInput) return;

				const competitor = { winRate: winInput.value, tieRate: tieInput.value };
				const invalid = this.isInvalid(competitor);

				winInput.classList.toggle('invalid', invalid);
				tieInput.classList.toggle('invalid', invalid && this.allowTies);
			}

			sortResults(field) {
				const isSameField = this.sortState.field === field;
				this.sortState = { field, direction: isSameField ? this.sortState.direction * -1 : (['name', 'rank'].includes(field) ? 1 : -1) };
				this.renderResults();
			}

			renderResults() {
				if (!this.processedResults) return;
				const { baselineId } = this.data;
				const maxElo = Math.max(...this.data.results.map(r => r.eloRating), 1);

				const { field, direction } = this.sortState;
				const sortedResults = [...this.processedResults].sort((a, b) =>
					typeof a[field] === 'string' ? direction * a[field].localeCompare(b[field], undefined, { numeric: true }) : direction * (a[field] - b[field])
				);

				this.sortedResults = sortedResults;

				const header = (key, label) => {
					const active = this.sortState.field === key;
					const className = active ? (this.sortState.direction === 1 ? 'sort-asc' : 'sort-desc') : '';
					const ariaSort = active ? (this.sortState.direction === 1 ? 'ascending' : 'descending') : 'none';
					return `<th class="${className}" data-sort="${key}" tabindex="0" role="columnheader" aria-sort="${ariaSort}">${label}</th>`;
				};

				const activeElement = document.activeElement;
				const savedSort = activeElement ? activeElement.dataset.sort : null;
				const savedId = activeElement ? activeElement.dataset.id : null;

				elements.resultsTable.innerHTML = `
					<h2>${this.string('resultsTitle')}</h2>
					<p class="info">${this.string('infoText')}</p>
					<div class="table-wrapper">
						<table>
							<thead>
								<tr>
									${header('rank', this.string('rank'))}
									${header('name', this.string('name'))}
									${header('displayWinRate', this.string('winRate'))}
									${this.data.isWinMode && this.data.allowTies ? header('tieRate', this.string('tieRate')) : ''}
									${this.data.isWinMode ? header('effectiveScore', this.string('effectiveScore')) : ''}
									${header('eloRating', this.string('eloRating'))}
									<th role="columnheader">${this.string('relativeStrength')}</th>
									${header('eloDifference', this.string('eloDifference'))}
								</tr>
							</thead>
							<tbody>
								${sortedResults.map((result, index) => {
									const isBaseline = result.id === baselineId;
									const isClosest = result.id === this.data.closestId && this.data.mode === 'elo';
									return `<tr class="${isBaseline ? 'highlight' : ''} ${isClosest ? 'avg-highlight' : ''}" style="cursor: pointer" data-id="${result.id}" tabindex="0" aria-selected="${isBaseline}">
										<td>${result.rank}</td>
										<td><strong>${escape(result.name)}</strong>${isClosest ? ' <span title="Closest to Average">~</span>' : ''}</td>
										<td>${this.format(result.displayWinRate, { maximumFractionDigits: 1 })}%</td>
										${this.data.isWinMode && this.data.allowTies ? `<td>${this.format(result.tieRate || 0, { maximumFractionDigits: 1 })}%</td>` : ''}
										${this.data.isWinMode ? `<td>${this.format(result.effectiveScore * 100, { maximumFractionDigits: 1 })}%</td>` : ''}
										<td><strong>${Math.round(result.eloRating)}</strong></td>
										<td><div class="bar-container" title="${Math.round(result.eloRating)}" aria-hidden="true"><div class="bar" style="width:${Math.max(0, result.eloRating / maxElo * 100)}%"></div></div></td>
										<td>${result.eloDifference > 0 ? '+' : ''}${Math.round(result.eloDifference)}</td>
									</tr>`;
								}).join('')}
							</tbody>
						</table>
					</div>`;

				if (savedSort) {
					elements.resultsTable.querySelector(`th[data-sort="${savedSort}"]`)?.focus();
					return;
				}
				if (savedId) {
					elements.resultsTable.querySelector(`tr[data-id="${savedId}"]`)?.focus();
				}
			}

			setBaseline(id) {
				if (this.data) {
					this.data.baselineId = isNaN(id) ? id : +id;
					this.updateRelativeStats();
					this.renderResults();
				}
			}

			generateTableText(separator) {
				if (!this.sortedResults) return null;
				const results = this.sortedResults;

				const headers = [
					this.string('rank'),
					this.string('name'),
					this.string('winRate'),
					...(this.data.isWinMode && this.data.allowTies ? [this.string('tieRate')] : []),
					...(this.data.isWinMode ? [this.string('effectiveScore')] : []),
					this.string('eloRating'),
					this.string('eloDifference')
				].join(separator);

				const escapeValue = value => {
					const stringValue = String(value);
					if (stringValue.includes(separator) || stringValue.includes('"') || stringValue.includes('\n')) return `"${stringValue.replace(/"/g, '""')}"`;
					return stringValue;
				};

				return headers + '\n' + results.map(result => {
					return [
						result.rank,
						result.name,
						this.format(result.displayWinRate, { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
						...(this.data.isWinMode && this.data.allowTies ? [result.tieRate || 0] : []),
						...(this.data.isWinMode ? [this.format(result.effectiveScore * 100, { minimumFractionDigits: 1, maximumFractionDigits: 1 })] : []),
						Math.round(result.eloRating),
						Math.round(result.eloDifference)
					].map(escapeValue).join(separator);
				}).join('\n');
			}

			export() {
				const csv = this.generateTableText(',');
				if (csv) Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `elo_ratings_${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.csv` }).click();
			}

			copy() {
				const tsv = this.generateTableText('\t');
				if (tsv) {
					navigator.clipboard.writeText(tsv).then(() => {
						elements.copy.textContent = this.string('copySuccess');
						setTimeout(() => elements.copy.textContent = this.string('copy'), 2000);
					});
				}
			}
		}
		new EloCalc();
	</script>
</body>
</html>
